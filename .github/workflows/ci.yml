name: CI
on:
  push:
  pull_request:
jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std if missing
        run: test -d lib/forge-std || forge install foundry-rs/forge-std --no-git
      - run: forge fmt --check src || true
      - run: forge build --sizes
      - run: forge test -vvv
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: sdk
        run: npm install --no-audit --no-fund && npm test
